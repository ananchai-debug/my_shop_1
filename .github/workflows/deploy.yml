def add(x, y):
    """ฟังก์ชันบวกเลข"""
    return x + y

def subtract(x, y):
    """ฟังก์ชันลบเลข"""
    return x - y

def multiply(x, y):
    """ฟังก์ชันคูณเลข"""
    return x * y

def divide(x, y):
    """ฟังก์ชันหารเลข (พร้อมตรวจจับการหารด้วยศูนย์)"""
    if y == 0:
        return "ข้อผิดพลาด: ไม่สามารถหารด้วย 0 ได้!"
    else:
        return x / y
print("=== โปรแกรมเครื่องคิดเลขอย่างง่าย ===")
print("1. บวก (+)")
print("2. ลบ (-)")
print("3. คูณ (*)")
print("4. หาร (/)")
    
    # รับตัวเลือกเมนูจากผู้ใช้
choice = input("เลือกเมนู (1-4): ")

    # ตรวจสอบว่าเลือกเมนูถูกต้องหรือไม่
if choice in ['1', '2', '3', '4']:
        # รับค่าตัวเลข 2 จำนวน
	num1 = float(input("กรอกตัวเลขที่ 1: "))
        num2 = float(input("กรอกตัวเลขที่ 2: "))

        # ตรวจสอบเงื่อนไขเพื่อเรียกใช้ฟังก์ชันตามเมนูที่เลือก
if choice == '1':
            result = add(num1, num2)
            print(f"ผลลัพธ์: {num1} + {num2} = {result}")

elif choice == '2':
            result = subtract(num1, num2)
            print(f"ผลลัพธ์: {num1} - {num2} = {result}")

elif choice == '3':
            result = multiply(num1, num2)
            print(f"ผลลัพธ์: {num1} * {num2} = {result}")

elif choice == '4':
            result = divide(num1, num2)
            print(f"ผลลัพธ์: {num1} / {num2} = {result}")

else:
   print("ข้อผิดพลาด: คุณเลือกเมนูไม่ถูกต้อง!")

1. การเขียนผังงาน (Flowchart)
• ใช้สัญลักษณ์มาตรฐานถูกต้อง (เริ่มต้น/จบ, รับ/แสดงผล, เงื่อนไข, ประมวลผล) (2 คะแนน)
• ทิศทางลูกศรและตรรกะลำดับขั้นตอนถูกต้อง ไม่สับสน (2 คะแนน)
• แสดงขั้นตอนเลือกเมนูและการรับค่าตัวเลข 1, 2 ได้ครบถ้วน (1 คะแนน)

2. การสร้างและใช้ฟังก์ชัน (def)
• ประกาศฟังก์ชัน def และตั้งชื่อถูกต้องทั้ง 4 ฟังก์ชัน (add, subtract, multiply, divide) (2 คะแนน)
• มีการรับพารามิเตอร์ (x, y) และส่งคืนค่าผลลัพธ์ด้วย return ถูกต้อง (2 คะแนน)

3. การเลือกเมนู (if-elif-else)
• ใช้ if-elif-else ตรวจสอบเมนู 1-4 ได้ถูกต้องตามตรรกะ (2 คะแนน)
• มีบล็อก else: สำหรับจัดการกรณีผู้ใช้เลือกเมนูไม่ถูกต้อง (2 คะแนน)

4. การรับค่าและการแสดงผล (input & print ,)
• ใช้ input() รับค่า num1 (ตัวที่ 1) และ num2 (ตัวที่ 2) พร้อมแปลงเป็น float() ได้ถูกต้อง (2 คะแนน)
• ใช้คำสั่ง print() แสดงผลลัพธ์โดยเชื่อมด้วยเครื่องหมายจุลภาค , ถูกต้อง (2 คะแนน)

5. ไวยากรณ์และการป้องกันข้อผิดพลาด
• มีการตรวจสอบเงื่อนไขไม่ให้ตัวหารเป็นศูนย์ (y == 0) ในฟังก์ชันหาร (1 คะแนน)
• ย่อหน้า (Indentation) ถูกต้อง โปรแกรมไม่เกิด IndentationError (1 คะแนน)
• โค้ดและผังงานอ่านง่าย เป็นระเบียบเรียบร้อย (1 คะแนน)
